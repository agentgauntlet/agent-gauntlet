[supervisord]
nodaemon=false
loglevel=info
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:caddy]
command=caddy run --config /app/Caddyfile --adapter caddyfile
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:landing]
command=node /app/landing/server.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cart]
command=node /app/cart-checkout/server.js
directory=/app
environment=PORT="3000",HTTPS_PORT="0",DATABASE_URL="%(ENV_DATABASE_URL)s",GITHUB_CLIENT_ID="%(ENV_GITHUB_CLIENT_ID)s",GITHUB_CLIENT_SECRET="%(ENV_GITHUB_CLIENT_SECRET)s",LINKEDIN_CLIENT_ID="%(ENV_LINKEDIN_CLIENT_ID)s",LINKEDIN_CLIENT_SECRET="%(ENV_LINKEDIN_CLIENT_SECRET)s",APP_URL="%(ENV_APP_URL)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:payment]
