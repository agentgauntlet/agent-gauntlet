name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'examples/**'
      - 'doc/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:        # allow manual deploy from the Actions UI

# Only run one deploy at a time. Cancel in-progress runs if a newer push lands.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  syntax-check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # NOTE: we do NOT pass `submodules: recursive` here. actions/checkout
        # treats failed submodule clone as a hard error, which blocks the
        # whole deploy when neither auth method is configured. Instead we
        # fetch the events submodule in a follow-up step that gracefully
        # skips when no credentials are available — the events module loads
        # as a stub via the try/catch in shared/scenario.js, and
        # ENABLE_EVENTS being unset short-circuits the mount anyway.

      # Fetch the private events submodule. Tries auth methods in this
      # order: SSH deploy key (preferred — scoped to one repo, immune to
      # org PAT policies) → fine-grained PAT → skip. If none are
      # configured, core deploys still succeed; the events module simply
      # isn't pulled in.
      - name: Fetch events submodule (SSH deploy key or PAT)
        env:
          SSH_KEY: ${{ secrets.EVENTS_DEPLOY_KEY }}
          PAT:     ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            echo "Using SSH deploy key for events submodule."
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            git config --global url."git@github.com:".insteadOf "https://github.com/"
            git submodule update --init --recursive
            echo "Events submodule fetched at $(cd private && git rev-parse --short HEAD)"
          elif [ -n "$PAT" ]; then
            echo "Using PAT for events submodule (fallback)."
            git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive
            echo "Events submodule fetched at $(cd private && git rev-parse --short HEAD)"
          else
            echo "Neither EVENTS_DEPLOY_KEY nor PRIVATE_REPO_PAT is set; skipping events submodule."
            echo "The events module will load as a no-op stub (mount() is wrapped in try/catch)."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      # Cheap smoke test: each scenario module loads cleanly.
      - name: Verify modules load
        run: |
          node -e "require('./shared/scenario')"
          node -e "require('./shared/scoring')"
          node -e "require('./shared/rate-limit')"
          node -e "require('./shared/risk')"
      # All test files in tests/. Currently includes:
      #   - isolation.test.js              (no core file imports private/events)
      #   - api-keys-override.test.js      (override-provider hook contract)
      #   - public-leaderboard-exclusion.test.js (env-var-driven exclusion)
      # The shell glob picks up new tests/*.test.js files automatically.
      # We use the explicit glob rather than bare `tests/` (which Node 24
      # treats as a single module entry, not a directory of tests) or `node
      # --test` (no args; auto-discovers but also picks up files outside
      # tests/, e.g. node-sdk fixtures inside the private submodule).
      - name: Tests
        run: node --test tests/*.test.js

  deploy:
    name: Deploy to Fly.io
    needs: syntax-check
    runs-on: ubuntu-latest
    environment: production    # requires manual approval — configured in repo settings
    steps:
      - uses: actions/checkout@v4
        # Same as syntax-check: no submodule auto-fetch here. We do it
        # explicitly in the next step so missing credentials don't block
        # the Fly deploy of the core app.

      - name: Fetch events submodule (SSH deploy key or PAT)
        env:
          SSH_KEY: ${{ secrets.EVENTS_DEPLOY_KEY }}
          PAT:     ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            git config --global url."git@github.com:".insteadOf "https://github.com/"
            git submodule update --init --recursive
          elif [ -n "$PAT" ]; then
            git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive
          else
            echo "No submodule credentials configured; deploying core without events module."
          fi

      - name: Setup flyctl
        # NOTE: pin to a commit SHA when ready (Settings → Security → Pinned actions).
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --app agentgauntlet
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
