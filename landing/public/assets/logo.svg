<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="120" rx="12" fill="#050d18"/>

  <!-- Hexagon frame -->
  <polygon
    points="60,8 100,8 118,40 100,72 60,72 42,40"
    stroke="url(#cyan-grad)" stroke-width="2.5" fill="none"
    filter="url(#glow)"/>

  <!-- Inner hex accent -->
  <polygon
    points="63,13 97,13 113,40 97,67 63,67 47,40"
    stroke="#06b6d4" stroke-width="0.5" fill="#06b6d405"/>

  <!-- Palm base -->
  <path d="M68 55 Q68 62 80 62 Q92 62 92 55 L92 38 Q92 34 88 34 L84 34 L84 28 Q84 25 81 25 Q78 25 78 28 L78 34 L75 34 L75 29 Q75 26 72 26 Q69 26 69 29 L69 34 Q66 34 66 38 Z"
    fill="#0e7490" stroke="#22d3ee" stroke-width="1.2" filter="url(#glow)"/>

  <!-- Finger 1 -->
  <rect x="78" y="20" width="6" height="15" rx="3" fill="#0e7490" stroke="#22d3ee" stroke-width="1"/>
  <!-- Finger 2 -->
  <rect x="72" y="22" width="5.5" height="13" rx="2.75" fill="#0e7490" stroke="#22d3ee" stroke-width="1"/>
  <!-- Finger 3 (pinky) -->
  <rect x="84.5" y="24" width="5" height="11" rx="2.5" fill="#0e7490" stroke="#22d3ee" stroke-width="1"/>
  <!-- Thumb -->
  <path d="M66 42 Q60 40 60 46 Q60 52 66 52" stroke="#22d3ee" stroke-width="1.2" fill="none"/>

  <!-- Circuit lines on palm -->
  <line x1="74" y1="44" x2="74" y2="55" stroke="#67e8f9" stroke-width="1" filter="url(#glow)"/>
  <line x1="80" y1="42" x2="80" y2="55" stroke="#67e8f9" stroke-width="1" filter="url(#glow)"/>
  <line x1="86" y1="44" x2="86" y2="55" stroke="#67e8f9" stroke-width="1" filter="url(#glow)"/>
  <line x1="70" y1="48" x2="90" y2="48" stroke="#67e8f9" stroke-width="0.8" filter="url(#glow)"/>

  <!-- Circuit nodes -->
  <circle cx="74" cy="44" r="2" fill="#22d3ee" filter="url(#glow-strong)"/>
  <circle cx="80" cy="42" r="2" fill="#22d3ee" filter="url(#glow-strong)"/>
  <circle cx="86" cy="44" r="2" fill="#22d3ee" filter="url(#glow-strong)"/>
  <circle cx="74" cy="55" r="1.5" fill="#67e8f9" filter="url(#glow)"/>
  <circle cx="80" cy="55" r="1.5" fill="#67e8f9" filter="url(#glow)"/>
  <circle cx="86" cy="55" r="1.5" fill="#67e8f9" filter="url(#glow)"/>

  <!-- Corner circuit traces -->
  <polyline points="42,40 36,40 33,35" stroke="#0e7490" stroke-width="1" fill="none"/>
  <circle cx="33" cy="35" r="1.5" fill="#06b6d4"/>
  <polyline points="118,40 124,40 127,45" stroke="#0e7490" stroke-width="1" fill="none"/>
  <circle cx="127" cy="45" r="1.5" fill="#06b6d4"/>

  <!-- Glow dot bottom-left of hex -->
  <circle cx="51" cy="56" r="2.5" fill="#22d3ee" filter="url(#glow-strong)" opacity="0.7"/>
  <!-- Glow dot top-right -->
  <circle cx="109" cy="24" r="2" fill="#67e8f9" filter="url(#glow-strong)" opacity="0.6"/>

  <!-- Wordmark -->
  <text x="145" y="52"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="30" font-weight="900" letter-spacing="2"
    fill="url(#text-grad)" filter="url(#glow)">AGENT</text>
  <text x="145" y="84"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="30" font-weight="900" letter-spacing="2"
    fill="url(#text-grad)" filter="url(#glow)">GAUNTLET</text>

  <!-- Tagline -->
  <text x="147" y="100"
    font-family="'Arial', sans-serif"
    font-size="10" letter-spacing="3"
    fill="#06b6d4" opacity="0.8">WEB AGENT BENCHMARK</text>
</svg>
